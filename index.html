<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
  <meta name="google-site-verification" content="rUh8ykv_vIzU685Or2IQuoZ0yGBAgkvGj_S1K0MEL9k" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="iBoardz - متجر إلكترونيات وأردوينو في السعودية. أفضل الأسعار والشحن السريع لجميع مناطق المملكة.">
<meta name="keywords" content="اردوينو, Arduino, ESP32, ESP8266, الكترونيات, المملكة العربية السعودية, iBoardz">
<meta name="theme-color" content="#ff9500">
<title>iBoardz - ARDUINO FUTURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo" onclick="nav('home')">
    <div class="logo-text"><span class="i">i</span><span class="boardz">Boardz</span></div>
  </div>
  <div class="header-actions">
    <button class="menu-btn" onclick="toggleMenu(event)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button class="cart-btn" onclick="openCart()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
  </div>
</header>

<div id="dropdown" class="dropdown-menu" style="display:none"></div>
<div id="menuBackdrop" style="display:none;position:fixed;inset:0;z-index:998" onclick="closeMenu()"></div>

<div id="cartOverlay" class="cart-overlay">
  <div class="cart-backdrop" onclick="closeCart()"></div>
  <div class="cart-panel">
    <div class="cart-header">
      <h2>سلة التسوق (<span id="cartCount">0</span>)</h2>
      <button class="cart-close" onclick="closeCart()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-footer" id="cartFooter" style="display:none"></div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none"></div>
<div id="toastContainer" class="toast-container"></div>
<button id="backToTop" class="back-to-top" aria-label="العودة للأعلى">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<main class="main" id="mainContent"></main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-top">
      <div class="footer-col">
        <div class="footer-logo"><span class="i">i</span><span class="boardz">Boardz</span></div>
        <div class="footer-subtitle">ARDUINO <span class="future">FUTURE</span></div>
        <p class="footer-desc">منصتك الأولى لمكونات الإلكترونيات والبرمجة في المملكة العربية السعودية</p>
      </div>
      <div class="footer-col">
        <h4>روابط سريعة</h4>
        <div class="footer-links" id="footerLinks"></div>
      </div>
      <div class="footer-col">
        <h4>تواصل معنا</h4>
        <div class="footer-contact">
          <p>واتساب: +966 552 645 082</p>
          <p>البريد: iBoardz@outlook.com</p>
        </div>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2025 iBoardz</span> - جميع الحقوق محفوظة</div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
